name: Morning Digest

on:
  schedule:
    # 目標配信時刻は 07:00 JST (22:00 UTC)。
    #
    # GitHub Actionsのscheduleは「必ず発火するが大幅に遅れる」挙動。2026-11-11の実測で、
    # 1日1本だけのSite Watchは7日連続100%発火した一方、遅延は193〜353分（3.2〜5.9時間）だった。
    # 逆にcronを5本に増やすと1〜3本しか発火しなくなる（本数が多いほど間引かれる）。
    #
    # そこで「本数を絞り、遅延分を見込んで早く置く」方針にしている。
    # 本命は目標の約7時間前。遅延3.2〜5.9時間を足すと 03:13〜05:53 JST に起動し、
    # send-digest.jsの担当窓（目標の5時間前〜目標）にちょうど収まるため、07:00に定刻配信できる。
    # ⚠️ 遅延の実測値が変わったらこのオフセットも再調整すること（再測定の手順はCLAUDE.md参照）
    - cron: "3 15 * * *" # 00:03 JST（本命。目標の約7時間前）
    # GitHubの遅延が解消された場合の保険（遅延ゼロならこれが担当窓に入る）
    - cron: "37 19 * * *" # 04:37 JST
  workflow_dispatch: {}

permissions:
  contents: write

# 本命と保険が同時に走って二重送信しないよう直列化する
concurrency:
  group: morning-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/send-digest.js morning
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 手動実行（workflow_dispatch）のときは待たずに即送信する
          TARGET_TIME_JST: ${{ github.event_name == 'schedule' && '07:00' || '' }}
      # 基本情報クイズは別のLINEボット（＝別トーク）から送る。朝刊と通知が混ざらないようにするため。
      # cronを増やさずに済むよう、同じrunの別ステップとして実行している。
      # クイズは付録なので、失敗しても朝刊の成否には影響させない
      - name: Send quiz (separate LINE bot)
        continue-on-error: true
        run: node scripts/send-quiz.js
        env:
          LINE_CHANNEL_ACCESS_TOKEN_QUIZ: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN_QUIZ }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_TIME_JST: ${{ github.event_name == 'schedule' && '07:00' || '' }}
      - name: Commit updated seen list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen-morning.json data/last-sent.json data/quiz-seen.json archive
          if ! git diff --cached --quiet; then
            git commit -m "chore: update morning seen list"
            # 他ワークフローのpushと競合した場合に備えて一度だけリトライ
            git push || (git pull --rebase && git push)
          fi
      - name: Notify failure
        if: failure()
        run: node scripts/notify-failure.js 朝刊
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
