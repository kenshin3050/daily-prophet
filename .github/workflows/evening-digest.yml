name: Evening Digest

on:
  schedule:
    # 目標配信時刻は 17:00 JST (08:00 UTC)。考え方はmorning-digest.ymlのコメント参照。
    # 本命は目標の約7時間前。遅延3.2〜5.9時間を足すと 13:13〜15:53 JST に起動し、
    # 担当窓（12:00〜17:00 JST）に収まる。
    # 以前は目標の5時間前〜直前に5本置いていたが、間引き＋遅延で窓に1本も入らず、
    # 2026-11-07〜11-11は4日連続で夕刊が欠配した
    - cron: "3 1 * * *" # 10:03 JST（本命。目標の約7時間前）
    # GitHubの遅延が解消された場合の保険
    - cron: "37 5 * * *" # 14:37 JST
  workflow_dispatch: {}

permissions:
  contents: write

# 本命と保険が同時に走って二重送信しないよう直列化する
concurrency:
  group: evening-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/send-digest.js evening
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 手動実行（workflow_dispatch）のときは待たずに即送信する
          TARGET_TIME_JST: ${{ github.event_name == 'schedule' && '17:00' || '' }}
      - name: Commit updated seen list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen-evening.json data/last-sent.json archive
          if ! git diff --cached --quiet; then
            git commit -m "chore: update evening seen list"
            # 他ワークフローのpushと競合した場合に備えて一度だけリトライ
            git push || (git pull --rebase && git push)
          fi
      - name: Notify failure
        if: failure()
        run: node scripts/notify-failure.js 夕刊
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
