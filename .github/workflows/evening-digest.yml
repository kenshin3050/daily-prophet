name: Evening Digest

on:
  schedule:
    # 目標配信時刻は 17:00 JST (08:00 UTC)。考え方はmorning-digest.ymlと同じで、
    # cronを目標時刻の前後にばらまき、担当の判定はsend-digest.js側で行う。
    # cronの本数を増やしすぎないこと（理由はmorning-digest.ymlのコメント参照）。
    # 12:07 / 14:07 / 16:07 JST に起動したrunが担当（定刻まで待機して17:00に送信）
    - cron: "7 3,5,7 * * *"
    # 17:20 / 18:20 JST。上が全滅した日に、遅れてでも配信するための枠
    - cron: "20 8,9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 本命と保険が同時に走って二重送信しないよう直列化する
concurrency:
  group: evening-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/send-digest.js evening
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 手動実行（workflow_dispatch）のときは待たずに即送信する
          TARGET_TIME_JST: ${{ github.event_name == 'schedule' && '17:00' || '' }}
      - name: Commit updated seen list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen-evening.json data/last-sent.json archive
          if ! git diff --cached --quiet; then
            git commit -m "chore: update evening seen list"
            # 他ワークフローのpushと競合した場合に備えて一度だけリトライ
            git push || (git pull --rebase && git push)
          fi
      - name: Notify failure
        if: failure()
        run: node scripts/notify-failure.js 夕刊
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
